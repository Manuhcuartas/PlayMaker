services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: playmaker-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  postgres-ingestion:
    image: postgres:16-alpine
    container_name: postgres-ingestion
    environment:
      POSTGRES_DB: ${POSTGRES_INGESTION_DB}
      POSTGRES_USER: ${POSTGRES_INGESTION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INGESTION_PASSWORD}
    ports:
      - "${POSTGRES_INGESTION_PORT}:5432"
    volumes:
      - ingestion_data:/var/lib/postgresql/data

  postgres-ticketing:
    image: postgres:16-alpine
    container_name: postgres-ticketing
    environment:
      POSTGRES_DB: ${POSTGRES_TICKETING_DB}
      POSTGRES_USER: ${POSTGRES_TICKETING_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TICKETING_PASSWORD}
    ports:
      - "${POSTGRES_TICKETING_PORT}:5432"
    volumes:
      - ticketing_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  ingestion_data:
  ticketing_data: